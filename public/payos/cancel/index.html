<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Returning to Artium</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
        margin: 0;
        padding: 32px 20px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border-radius: 20px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        padding: 24px;
        max-width: 420px;
        margin: 0 auto;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      }
      .muted {
        color: #64748b;
        margin-top: 8px;
      }
      .link {
        display: inline-block;
        margin-top: 16px;
        color: #0b73ff;
        font-weight: 600;
        text-decoration: none;
      }
      #fallback {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Returning to Artium</h1>
      <p class="muted">We are opening the app to finish your payment.</p>
      <div id="fallback">
        <p class="muted">
          If the app did not open, tap the button below.
        </p>
        <a class="link" id="deeplink" href="#">Open Artium</a>
      </div>
    </div>
    <script>
      (function () {
        var params = window.location.search || "";
        var deepLink = "artium://payos/cancel" + params;
        var deepLinkEl = document.getElementById("deeplink");
        if (deepLinkEl) {
          deepLinkEl.href = deepLink;
        }
        window.location.href = deepLink;
        setTimeout(function () {
          var fallback = document.getElementById("fallback");
          if (fallback) {
            fallback.style.display = "block";
          }
        }, 1500);
      })();
    </script>
  </body>
</html>
